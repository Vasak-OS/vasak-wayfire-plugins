# Acá no se llama al workflow compartido de la organización.
#
# Ese está hecho para las aplicaciones: mira `package.json`, `Cargo.toml`,
# biome, `vue-tsc`. Este repositorio no tiene nada de eso — es C++ con meson— y
# llamarlo sería pedirle que comprobara archivos que no existen.
#
# Tampoco se compila el plugin en sí. Necesita los encabezados de Wayfire 0.11,
# que no están en los repositorios de Ubuntu, así que hacerlo pediría un
# contenedor de Arch en cada corrida. El plugin se compila al armar el paquete,
# que es donde esas dependencias ya están. No se deja un paso que lo intente y
# se perdone si falla: un paso que no puede fallar no comprueba nada y hace
# creer que sí.
#
# Lo que sí se comprueba es lo único que decide algo: `vigilancia.cpp`. Está
# separado del enganche con Wayfire justamente para esto — no incluye ni un
# encabezado de Wayland, así que compila y corre en un runner pelado.
#
# El paso de Sonar sí está, y está escrito acá en vez de heredado del
# compartido. El compartido lo trae en un trabajo que además instala Bun, corre
# `bun install` y saca la cobertura del frontend: acá no hay nada de eso que sea
# cierto, y llamarlo para conseguir un paso de análisis sería arrastrar tres
# pasos muertos. Lo que se copia son los `args` y el token, que son pocas
# líneas y se leen.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # Sólo lectura: clona, compila y corre pruebas. No comenta, no etiqueta, no
    # publica.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compilar y correr las pruebas
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I src/permisos-globales \
            -o pruebas-vigilancia \
            pruebas/vigilancia.cpp src/permisos-globales/vigilancia.cpp
          ./pruebas-vigilancia

  # ── SonarQube Cloud ──────────────────────────────────────────────────────
  #
  # Trabajo aparte y no un paso de `pruebas`, por la misma razón que en el
  # compartido: el análisis no necesita el plugin ni el compilador, y si
  # compartiera trabajo con las pruebas, un problema del análisis frenaría un
  # merge cuyo código está bien y que las pruebas ya dieron por bueno.
  #
  # Es el único análisis de C++ de la organización, y va **sin base de
  # compilación** a propósito. Generarla con meson pediría los encabezados de
  # Wayfire 0.11 —justo lo que arriba se explica que no hay en un runner de
  # Ubuntu— y entonces el análisis dependería de poder compilar el plugin, que
  # este workflow no compila y no va a empezar a compilar. SonarQube Cloud
  # analiza el C++ sin base de compilación en modo AutoConfig, así que alcanza
  # con correr el escáner. Lo que se pierde es resolver los `#include` de
  # Wayfire, que el análisis reporta como no resueltos sin cortar nada.
  sonar:
    runs-on: ubuntu-latest
    # Sólo lectura: lee el repositorio y manda el resultado a Sonar. No
    # comenta, no etiqueta, no publica.
    permissions:
      contents: read
    steps:
      # Sin `SONAR_TOKEN` se saltea y lo dice, en vez de fallar: un PR desde
      # un fork no recibe secretos, y un repositorio al que todavía no se le
      # dio el token tampoco. Es la misma propiedad que tiene el compartido, y
      # es la que hace que este trabajo no pueda romper un PR ajeno.
      - name: Hay token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin SONAR_TOKEN: se saltea el análisis."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.token.outputs.hay == 'true'
        with:
          persist-credentials: false
          # Sonar asigna cada línea a su commit para saber qué es código nuevo,
          # y para eso necesita el historial entero.
          fetch-depth: 0

      - name: Análisis
        if: steps.token.outputs.hay == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # La clave del proyecto sigue la forma que usa SonarQube Cloud al
          # importar desde GitHub, que es la que ya usan los proyectos de antes.
          #
          # Las pruebas se declaran como pruebas. Si no, Sonar las cuenta como
          # código sin probar —nadie prueba las pruebas— y la cobertura del
          # código nuevo se hunde justo en el PR que más pruebas suma. El
          # directorio de pruebas acá se llama `pruebas`, no `tests`.
          #
          # `build/` es el directorio de meson, el mismo que está en el
          # `.gitignore`: el escáner no lee el `.gitignore`, así que hay que
          # excluirlo aparte o contaría las pruebas como código.
          #
          # No hay `sonar.javascript.lcov.reportPaths` como en el compartido:
          # acá no hay Bun ni cobertura que reportar.
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**

  # ── DIAGNÓSTICO TEMPORAL ────────────────────────────────────────────────
  #
  # Esto no va al PR: se borra en el commit siguiente. La pregunta que
  # responde es por qué el trabajo `sonar` da 0 unidades de compilación.
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Hay token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Sin token: el diagnóstico no puede correr."
            exit 1
          fi
          echo "hay=true" >> "$GITHUB_OUTPUT"

      - name: 1 · tal cual
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**
            -Dsonar.log.level=DEBUG

      - name: '¿el log del paso anterior es legible desde acá?'
        if: steps.token.outputs.hay
        run: |
          echo "RUNNER_STEP_LOG=$RUNNER_STEP_LOG"
          ls -l "$RUNNER_STEP_LOG" 2>&1 || true
          echo "--- ¿'compilation units' en el log de ESTE paso?"
          grep -c 'compilation units' "$RUNNER_STEP_LOG" || echo "0 coincidencias"
          echo "--- ¿'EXECUTION' o 'ANALYSIS SUCCESSFUL'?"
          grep -cE 'EXECUTION|ANALYSIS SUCCESSFUL' "$RUNNER_STEP_LOG" || echo "0 coincidencias"
          echo "--- .scannerwork:"
          find .scannerwork -type f 2>&1 | head -40
          echo "--- report-task.txt:"
          cat .scannerwork/report-task.txt 2>&1 | head -20
          echo "--- logs o dumps sueltos:"
          find . -maxdepth 2 \( -name '*.log' -o -name '*.dump' \) 2>/dev/null | head -20

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: 2 · sin sonar.tests
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: 3 · sin exclusiones
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: 4 · sources=src
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: '5 · preparar: sin meson.build'
        if: steps.token.outputs.hay
        run: |
          git ls-files | grep 'meson\.build$' | while read -r f; do mv "$f" "$f.bak"; done
          git status --porcelain

      - name: 5 · sin meson.build
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git ls-files --others --exclude-standard | grep '\.bak$' | while read -r f; do mv "$f" "${f%.bak}"; done
          git checkout -- .
          git clean -xfdq
          git status --porcelain

      - name: '6 · preparar: base de compilación a mano'
        if: steps.token.outputs.hay
        run: |
          cat > compile_commands.json <<JSON
          [
            {
              "directory": "$GITHUB_WORKSPACE",
              "command": "g++ -std=c++20 -I src/permisos-globales -c src/permisos-globales/vigilancia.cpp",
              "file": "$GITHUB_WORKSPACE/src/permisos-globales/vigilancia.cpp"
            }
          ]
          JSON
          cat compile_commands.json

      - name: 6 · base de compilación a mano
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: '7 · preparar: cobertura gcov'
        if: steps.token.outputs.hay
        run: |
          g++ -std=c++20 --coverage -c -I src/permisos-globales \
            -o pruebas-vigilancia.o pruebas/vigilancia.cpp
          g++ -std=c++20 --coverage -c -I src/permisos-globales \
            -o src-vigilancia.o src/permisos-globales/vigilancia.cpp
          g++ --coverage -o pruebas-vigilancia pruebas-vigilancia.o src-vigilancia.o
          ./pruebas-vigilancia | tail -3
          gcov -o . src-vigilancia.o 2>&1 | head -10
          ls -1 *.gcov 2>&1 | head

      - name: 7 · cobertura gcov
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/pruebas/**
            -Dsonar.test.exclusions=**/build/**
            -Dsonar.cfamily.gcov.reportsPath=${{ github.workspace }}
            -Dsonar.log.level=DEBUG

      - name: cómo quedó el panel
        if: always() && steps.token.outputs.hay
        run: |
          clave="Vasak-OS_${{ github.event.repository.name }}"
          for i in $(seq 1 20); do
            cuerpo=$(curl -fsS "https://sonarcloud.io/api/measures/component?component=$clave&pullRequest=${{ github.event.pull_request.number }}&metricKeys=ncloc,ncloc_language_distribution,coverage" || echo "")
            if [ -n "$cuerpo" ]; then echo "$cuerpo"; break; fi
            echo "aún no está ($i)"; sleep 15
          done
