# Acá no se llama al workflow compartido de la organización.
#
# Ese está hecho para las aplicaciones: mira `package.json`, `Cargo.toml`,
# biome, `vue-tsc`. Este repositorio no tiene nada de eso — es C++ con meson— y
# llamarlo sería pedirle que comprobara archivos que no existen.
#
# Tampoco se compila el plugin en sí. Necesita los encabezados de Wayfire 0.11,
# que no están en los repositorios de Ubuntu, así que hacerlo pediría un
# contenedor de Arch en cada corrida. El plugin se compila al armar el paquete,
# que es donde esas dependencias ya están. No se deja un paso que lo intente y
# se perdone si falla: un paso que no puede fallar no comprueba nada y hace
# creer que sí.
#
# Lo que sí se comprueba es lo único que decide algo: `vigilancia.cpp`. Está
# separado del enganche con Wayfire justamente para esto — no incluye ni un
# encabezado de Wayland, así que compila y corre en un runner pelado.
#
# El paso de Sonar sí está, y está escrito acá en vez de heredado del
# compartido. El compartido lo trae en un trabajo que además instala Bun, corre
# `bun install` y saca la cobertura del frontend: acá no hay nada de eso que sea
# cierto, y llamarlo para conseguir un paso de análisis sería arrastrar tres
# pasos muertos. Lo que se copia son los `args` y el token, que son pocas
# líneas y se leen.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # Sólo lectura: clona, compila y corre pruebas. No comenta, no etiqueta, no
    # publica.
    permissions:
      contents: read
    steps:
      # Clavado al commit, como en el compartido. La etiqueta `v4` es móvil —
      # hoy resuelve a la v4.4.0— y una etiqueta que se mueve sola es una
      # dependencia que cambia sin que cambie el archivo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compilar y correr las pruebas
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I src/permisos-globales \
            -o pruebas-vigilancia \
            pruebas/vigilancia.cpp src/permisos-globales/vigilancia.cpp
          ./pruebas-vigilancia

  # ── SonarQube Cloud ──────────────────────────────────────────────────────
  #
  # Trabajo aparte y no un paso de `pruebas`, pero no por el análisis. Lo único
  # que exige el ruleset «Proteger main» de la organización es `pruebas`, y
  # `SonarCloud` no es chequeo requerido en ninguno de los 49 repositorios:
  # que este trabajo se caiga no frena ningún merge, y separarlo tampoco es lo
  # que desbloquea uno — el merge no dependía de él. Lo que sí evita es que el
  # rojo del análisis y el de las pruebas terminen en el mismo paso, donde no se
  # sabe cuál de los dos fue.
  #
  # Va **sin base de compilación** a propósito. Generarla con meson pediría los
  # encabezados de Wayfire 0.11 —justo lo que arriba se explica que no hay en
  # un runner de Ubuntu— y entonces el análisis dependería de poder compilar el
  # plugin, que este workflow no compila y no va a empezar a compilar. En modo
  # AutoConfig no hace falta: cada `.cpp` del ámbito se analiza por separado, sin
  # base de compilación. Medido en una corrida: 2 unidades de compilación
  # (`plugin.cpp` y `vigilancia.cpp`), las dos analizadas enteras.
  #
  # Lo que sí se pierde, y que no conviene vender como una comodidad que falte,
  # es el analizador de tainted data —apagado entero en AutoConfig— y 27 reglas
  # que en AutoConfig no corren, entre ellas S2076, S2078 y S2083, que son las
  # de inyección de comandos y de rutas. Para un plugin cuya función es decidir
  # qué protocolos privilegiados anuncia el compositor, dejar de mirar inyección
  # es perder justo lo que este plugin existe para no tener. No es una pérdida
  # propia de este camino: la app de SonarSource analiza este repositorio sin
  # base de compilación también, así que el mismo límite corre de las dos partes.
  # Lo que cambia es que ahora el análisis se puede pedir cuando se quiere.
  sonar:
    runs-on: ubuntu-latest
    # Sólo lectura: lee el repositorio y manda el resultado a Sonar. No
    # comenta, no etiqueta, no publica.
    permissions:
      contents: read
    steps:
      # Sin `SONAR_TOKEN` se saltea y lo dice, en vez de fallar: un PR desde
      # un fork no recibe secretos, y un repositorio al que todavía no se le
      # dio el token tampoco. Es la misma propiedad que tiene el compartido, y
      # es la que hace que este trabajo no pueda romper un PR ajeno.
      - name: Hay token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin SONAR_TOKEN: se saltea el análisis."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.token.outputs.hay == 'true'
        with:
          persist-credentials: false
          # Sonar asigna cada línea a su commit para saber qué es código nuevo,
          # y para eso necesita el historial entero.
          fetch-depth: 0

      - name: Análisis
        if: steps.token.outputs.hay == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # La clave del proyecto sigue la forma que usa SonarQube Cloud al
          # importar desde GitHub, que es la que ya usan los proyectos de antes.
          #
          # `sonar.sources` se escribe aunque valga `.`, y esa es la parte que
          # no es obvia. Con `sonar.sources` sin declarar y `sonar.tests`
          # declarado —el error que traía este archivo— el escáner indexa
          # **sólo** los archivos de prueba: dos, los de `pruebas/`, y `src/`
          # desaparece del análisis. Cero unidades de compilación y paso en
          # verde. Lo que se quería era «las pruebas van aparte», y eso se
          # dice apuntando `sonar.tests` al directorio de las pruebas.
          #
          # Las pruebas se declaran como pruebas. Si no, el panel las cuenta
          # como código sin probar —nadie prueba las pruebas— y la cobertura
          # del código nuevo se hunde justo en el PR que más pruebas suma. El
          # directorio se llama `pruebas`, no `tests`, y va en `sonar.tests`
          # apuntando al directorio, no a `.`.
          #
          # `pruebas/` tiene que estar **también** en las exclusiones del
          # código principal. Los dos conjuntos tienen que ser disjuntos y el
          # escáner lo cobra: sin la exclusión se para con
          # `sources_tests_overlap` («File pruebas/meson.build can't be indexed
          # twice») y sale con código 3. Con la exclusión, 13 archivos
          # indexados, 4 lenguajes y 2 unidades de compilación.
          #
          # `build/` es el directorio de meson, el mismo que está en el
          # `.gitignore`: el escáner no lee el `.gitignore`, así que hay que
          # excluirlo aparte o contaría las pruebas como código.
          #
          # No hay `sonar.javascript.lcov.reportPaths` como en el compartido:
          # acá no hay Bun ni cobertura que reportar. La cobertura de
          # `vigilancia.cpp` sí se podría sacar con `--coverage` y
          # `sonar.cfamily.gcov.reportsPath`; se verificó que el importador
          # gcov funciona en AutoConfig, así que queda para otro PR y no para
          # éste.
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/build/**,**/pruebas/**
            -Dsonar.tests=pruebas

      # El escáner no crea ningún check ni ningún estado: sale en verde si
      # termina, haya mirado algo o no. Lo que se comprueba acá es lo único que
      # se puede comprobar desde afuera: que hubo un análisis, que se publicó y
      # que el servidor lo procesó en serio. Un escáner caído, un token
      # vencido o un SonarCloud que no contesta tienen que dejar el trabajo en
      # rojo y con un motivo, no un verde con un `SUCCESSFUL` de adorno.
      #
      # Lo que **no** se puede comprobar, y conviene que quede escrito: que el
      # análisis haya visto el C++. La salida del escáner no se lee desde otro
      # paso —`RUNNER_STEP_LOG` viene vacío en este runner y la acción no
      # expone salidas—, y las medidas de la rama no sirven: son incrementales,
      # así que un análisis ciego se lleva los números viejos y la comprobación
      # daría verde con el panel en blanco. La única forma de afirmarlo es
      # correr el escáner con `tee` en un paso de shell, y eso implicaría
      # rehacer la descarga con verificación de firma que hace la acción.
      #
      # Lo que sí cubre el caso que nos mordió es la forma de los `args` de
      # arriba: `sonar.sources` explícito, y conjuntos disjuntos, que el
      # escáner rechaza solo.
      - name: El análisis se publicó
        if: success() && steps.token.outputs.hay == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          informe=.scannerwork/report-task.txt
          if [ ! -s "$informe" ]; then
            echo "::error::El escáner terminó sin dejar informe: no publicó ningún análisis."
            exit 1
          fi
          tarea=$(sed -n 's/^ceTaskId=//p' "$informe")
          if [ -z "$tarea" ]; then
            echo "::error::El informe no trae ceTaskId: el escáner no llegó a mandar nada."
            exit 1
          fi
          echo "Tarea de análisis: $tarea"
          # La espera es acotada a propósito: un SonarCloud que no contesta
          # tiene que verse, no dejar el paso esperando para siempre.
          estado=""
          for intento in $(seq 1 30); do
            json=$(curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarcloud.io/api/ce/task?id=$tarea" || echo "")
            estado=$(printf '%s' "$json" | sed -n 's/.*"status":"\([A-Z]*\)".*/\1/p')
            case "$estado" in
              SUCCESS | FAILED) break ;;
              *) echo "El servidor todavía no procesó la tarea (intento $intento de 30)." ;;
            esac
            sleep 10
          done
          if [ "$estado" != SUCCESS ]; then
            echo "::error::El análisis no llegó a procesarse (estado: ${estado:-sin respuesta})."
            exit 1
          fi
          echo "::notice::SonarQube Cloud procesó el análisis."
