# DIAGNÓSTICO TEMPORAL — se borra en el commit siguiente, no va al PR.
name: Diagnóstico del escáner

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Hay token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Sin token: el diagnóstico no puede correr."
            exit 1
          fi
          echo "hay=true" >> "$GITHUB_OUTPUT"

      - name: 'B1 · sources=. + tests=pruebas'
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/build/**
            -Dsonar.tests=pruebas
            -Dsonar.log.level=DEBUG

      - name: limpiar
        if: steps.token.outputs.hay
        run: |
          git checkout -- .
          git clean -xfdq

      - name: 'C · preparar cobertura gcov'
        if: steps.token.outputs.hay
        run: |
          g++ -std=c++20 --coverage -c -I src/permisos-globales \
            -o pruebas-vigilancia.o pruebas/vigilancia.cpp
          g++ -std=c++20 --coverage -c -I src/permisos-globales \
            -o src-vigilancia.o src/permisos-globales/vigilancia.cpp
          g++ --coverage -o pruebas-vigilancia pruebas-vigilancia.o src-vigilancia.o
          ./pruebas-vigilancia | tail -2
          gcov -o . src-vigilancia.o 2>&1 | tail -3
          ls -1 *.gcov

      - name: 'C · B1 + gcov'
        if: steps.token.outputs.hay
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/build/**,**/*.gcov,**/*.gcda,**/*.gcno,**/*.o
            -Dsonar.tests=pruebas
            -Dsonar.cfamily.gcov.reportsPath=${{ github.workspace }}
            -Dsonar.log.level=DEBUG

      - name: 'el assertion, tal cual va a quedar'
        if: always() && steps.token.outputs.hay
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          informe=.scannerwork/report-task.txt
          if [ ! -s "$informe" ]; then
            echo "::error::El escáner terminó sin dejar informe: no publicó ningún análisis."
            exit 1
          fi
          tarea=$(sed -n 's/^ceTaskId=//p' "$informe")
          if [ -z "$tarea" ]; then
            echo "::error::El informe no trae ceTaskId: el escáner no llegó a mandar nada."
            exit 1
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            donde="pullRequest=${{ github.event.pull_request.number }}"
          else
            donde="branch=${{ github.ref_name }}"
          fi
          estado=""
          for intento in $(seq 1 30); do
            tarea_json=$(curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarcloud.io/api/ce/task?id=$tarea" || echo "")
            echo "--- ce/task intento $intento: $(printf '%s' "$tarea_json" | head -c 500)"
            estado=$(printf '%s' "$tarea_json" | sed -n 's/.*"status":"\([A-Z]*\)".*/\1/p')
            case "$estado" in
              SUCCESS | FAILED) break ;;
              "") echo "El servidor no contesta (intento $intento de 30)." ;;
            esac
            sleep 10
          done
          if [ "$estado" != SUCCESS ]; then
            echo "::error::El análisis no llegó a procesarse (estado: ${estado:-sin respuesta})."
            exit 1
          fi
          for intento in $(seq 1 3); do
            cuerpo=$(curl -fsS \
              "https://sonarcloud.io/api/measures/component?component=Vasak-OS_${{ github.event.repository.name }}&$donde&metricKeys=ncloc_language_distribution,coverage" \
              || echo "")
            echo "--- measures intento $intento: $(printf '%s' "$cuerpo" | head -c 500)"
            cpp=$(printf '%s' "$cuerpo" | sed 's/\\u003d/=/g' \
              | grep -o 'cpp=[0-9]\+' | head -1 | cut -d= -f2)
            if [ "${cpp:-0}" -gt 0 ] 2>/dev/null; then
              echo "::notice::El análisis ve $cpp líneas de C++."
              exit 0
            fi
            echo "Todavía sin C++ publicado (intento $intento de 3)."
            sleep 10
          done
          echo "::error::El análisis se publicó sin C++: el panel ya no describe este plugin."
          exit 1

      - name: 'dónde quedó cada análisis'
        if: always() && steps.token.outputs.hay
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          NUMERO_PR: ${{ github.event.pull_request.number }}
        run: |
          clave="Vasak-OS_${{ github.event.repository.name }}"
          for donde in "branch=main" "pullRequest=$NUMERO_PR" \
                        "branch=$HEAD_REF" "branch=$REF_NAME" \
                        "branch=$NUMERO_PR/merge"; do
            echo "=== $donde"
            curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarcloud.io/api/measures/component_tree?component=$clave&$donde&metricKeys=ncloc,coverage&ps=100" \
              | tr ',' '\n' | grep -E '"path"|"total"|"value"' | head -30
            echo
          done
